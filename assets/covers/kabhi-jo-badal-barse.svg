<svg class="sp-cover" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="nightViolet" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3a1a68"/>
                <stop offset="35%" stop-color="#241048"/>
                <stop offset="70%" stop-color="#120828"/>
                <stop offset="100%" stop-color="#080414"/>
              </linearGradient>
              <radialGradient id="horizonV" cx="50%" cy="0%" r="70%">
                <stop offset="0%" stop-color="#8a60c8" stop-opacity="0.55"/>
                <stop offset="55%" stop-color="#503088" stop-opacity="0.2"/>
                <stop offset="100%" stop-color="#503088" stop-opacity="0"/>
              </radialGradient>
              <radialGradient id="moonSoft" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#f8f0ff"/>
                <stop offset="45%" stop-color="#d8c4f0" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="#a080d0" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="cloudBand" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#e8dcf8" stop-opacity="0.55"/>
                <stop offset="40%" stop-color="#9a80c0" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#4a3870" stop-opacity="0.15"/>
              </linearGradient>
              <linearGradient id="glassTint" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#c8b0e8" stop-opacity="0.06"/>
                <stop offset="100%" stop-color="#080414" stop-opacity="0.2"/>
              </linearGradient>
              <linearGradient id="dropGlass" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
                <stop offset="100%" stop-color="#c8b0e8" stop-opacity="0.15"/>
              </linearGradient>
              <filter id="blurSoft" x="-10%" y="-10%" width="120%" height="120%">
                <feGaussianBlur stdDeviation="1.4"/>
              </filter>
            </defs>

            <!-- sky beyond the glass -->
            <rect width="240" height="240" fill="url(#nightViolet)"/>
            <rect width="240" height="240" fill="url(#horizonV)"/>

            <!-- distant moon -->
            <circle cx="168" cy="48" r="26" fill="url(#moonSoft)" opacity="0.85"/>
            <circle cx="168" cy="48" r="14" fill="#f0e8fc" opacity="0.9"/>
            <circle cx="174" cy="44" r="12" fill="#241048" opacity="0.35"/>

            <!-- far cloud layer — soft, adult, atmospheric -->
            <g filter="url(#blurSoft)" opacity="0.75">
              <ellipse cx="60" cy="72" rx="48" ry="14" fill="url(#cloudBand)"/>
              <ellipse cx="120" cy="64" rx="56" ry="16" fill="url(#cloudBand)"/>
              <ellipse cx="180" cy="76" rx="42" ry="12" fill="url(#cloudBand)"/>
              <ellipse cx="90" cy="82" rx="36" ry="10" fill="#6a5090" opacity="0.5"/>
              <ellipse cx="150" cy="86" rx="40" ry="11" fill="#5a4080" opacity="0.45"/>
            </g>

            <!-- mid haze -->
            <ellipse cx="120" cy="110" rx="100" ry="28" fill="#3a2860" opacity="0.25"/>

            <!-- glass overlay -->
            <rect width="240" height="240" fill="url(#glassTint)"/>

            <!-- rain on glass — streaks + beads (mature, not cartoon) -->
            <g stroke="url(#dropGlass)" stroke-linecap="round" fill="none">
              <line x1="42" y1="40" x2="38" y2="120" stroke-width="1.1" opacity="0.45"/>
              <line x1="68" y1="28" x2="62" y2="148" stroke-width="1.4" opacity="0.55"/>
              <line x1="96" y1="36" x2="92" y2="160" stroke-width="1.2" opacity="0.5"/>
              <line x1="128" y1="24" x2="126" y2="170" stroke-width="1.5" opacity="0.6"/>
              <line x1="158" y1="32" x2="162" y2="152" stroke-width="1.2" opacity="0.48"/>
              <line x1="186" y1="44" x2="192" y2="130" stroke-width="1.1" opacity="0.42"/>
              <line x1="54" y1="90" x2="52" y2="190" stroke-width="0.9" opacity="0.35"/>
              <line x1="110" y1="100" x2="108" y2="200" stroke-width="1" opacity="0.38"/>
              <line x1="172" y1="95" x2="176" y2="195" stroke-width="0.9" opacity="0.35"/>
            </g>

            <!-- water beads on glass -->
            <g fill="#e8dcf8">
              <ellipse cx="74" cy="108" rx="2.2" ry="3.4" opacity="0.55"/>
              <ellipse cx="118" cy="132" rx="2.8" ry="4.2" opacity="0.65"/>
              <ellipse cx="148" cy="98" rx="2" ry="3" opacity="0.5"/>
              <ellipse cx="98" cy="168" rx="2.4" ry="3.6" opacity="0.58"/>
              <ellipse cx="164" cy="156" rx="2.1" ry="3.2" opacity="0.52"/>
              <ellipse cx="56" cy="152" rx="1.8" ry="2.8" opacity="0.45"/>
              <ellipse cx="190" cy="118" rx="2" ry="3" opacity="0.48"/>
              <circle cx="76" cy="106" r="0.8" fill="#ffffff" opacity="0.7"/>
              <circle cx="117" cy="130" r="0.9" fill="#ffffff" opacity="0.75"/>
            </g>

            <!-- thin window edge — subtle frame -->
            <rect x="8" y="8" width="224" height="224" fill="none" stroke="#c8b0e8" stroke-opacity="0.12" stroke-width="1.2"/>
            <line x1="120" y1="8" x2="120" y2="232" stroke="#c8b0e8" stroke-opacity="0.08" stroke-width="1"/>

            <!-- soft reflection / bottom vignette -->
            <ellipse cx="120" cy="220" rx="90" ry="18" fill="#080414" opacity="0.55"/>
          </svg>