<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chirkut · Music cards</title>
    <meta
      name="description"
      content="Moonlit music cards by chirkut — play the song, print the card."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="player-page">
    <div class="sky" aria-hidden="true">
      <canvas id="stars"></canvas>
      <div class="glow glow-moon"></div>
      <div class="glow glow-soft"></div>
      <div class="mist"></div>
    </div>

    <main class="stage">
      <p class="dedication">for my best friend</p>

      <div class="moon-scene" aria-hidden="true">
        <svg class="crescent" viewBox="0 0 200 200" role="img">
          <defs>
            <radialGradient id="moonFill" cx="38%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#fff8ea" />
              <stop offset="45%" stop-color="#f0e2c4" />
              <stop offset="100%" stop-color="#c9b48a" />
            </radialGradient>
            <filter id="moonSoft">
              <feGaussianBlur stdDeviation="1.2" />
            </filter>
          </defs>
          <circle cx="100" cy="100" r="62" fill="url(#moonFill)" opacity="0.95" />
          <circle cx="128" cy="88" r="54" fill="#070b14" />
        </svg>

        <svg class="earring earring-left" viewBox="0 0 60 120" role="img">
          <path
            d="M30 8 C30 8 18 22 18 38 C18 52 30 60 30 60 C30 60 42 52 42 38 C42 22 30 8 30 8 Z"
            fill="none"
            stroke="#e8d5a3"
            stroke-width="1.5"
          />
          <circle cx="30" cy="8" r="3.5" fill="#f2e6c4" />
          <circle cx="30" cy="72" r="7" fill="none" stroke="#d4af6a" stroke-width="1.4" />
          <circle cx="30" cy="72" r="2.5" fill="#f2e6c4" />
          <path
            d="M30 79 Q22 92 30 104 Q38 92 30 79"
            fill="none"
            stroke="#e8d5a3"
            stroke-width="1.2"
          />
          <circle cx="30" cy="108" r="3" fill="#d4af6a" />
        </svg>

        <svg class="earring earring-right" viewBox="0 0 60 120" role="img">
          <path
            d="M30 8 C30 8 18 22 18 38 C18 52 30 60 30 60 C30 60 42 52 42 38 C42 22 30 8 30 8 Z"
            fill="none"
            stroke="#e8d5a3"
            stroke-width="1.5"
          />
          <circle cx="30" cy="8" r="3.5" fill="#f2e6c4" />
          <circle cx="30" cy="72" r="7" fill="none" stroke="#d4af6a" stroke-width="1.4" />
          <circle cx="30" cy="72" r="2.5" fill="#f2e6c4" />
          <path
            d="M30 79 Q22 92 30 104 Q38 92 30 79"
            fill="none"
            stroke="#e8d5a3"
            stroke-width="1.2"
          />
          <circle cx="30" cy="108" r="3" fill="#d4af6a" />
        </svg>
      </div>

      <header class="title-block">
        <h1 id="songTitle">Chaand Baaliyan</h1>
        <p class="artist" id="artistLabel">Aditya A</p>
        <p class="meaning">music cards · chirkut</p>
      </header>

      <div class="track-list" id="trackList" aria-label="Songs"></div>

      <section class="player" aria-label="Music player">
        <button
          type="button"
          class="play-btn"
          id="playBtn"
          aria-label="Play Chaand Baaliyan"
        >
          <span class="play-icon" aria-hidden="true"></span>
        </button>

        <div class="player-meta">
          <div class="track-row">
            <span id="trackLabel">Chaand Baaliyan</span>
            <span id="timeLabel">0:00 / 0:00</span>
          </div>
          <div
            class="progress"
            id="progress"
            role="slider"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-label="Song progress"
            tabindex="0"
          >
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </section>

      <p class="note" id="audioNote" hidden>
        Song file missing — check the <code>audio/</code> folder.
      </p>

      <audio id="audio" preload="metadata" src="audio/chaand-baaliyan.mp3"></audio>

      <footer class="foot">
        <a class="quiet-link" id="cardLink" href="card.html">Print the music card</a>
        <a class="quiet-link" href="cards.html">All cards</a>
      </footer>
    </main>

    <script src="stars.js"></script>
    <script src="player.js"></script>
  </body>
</html>
