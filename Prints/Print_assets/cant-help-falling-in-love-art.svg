<svg class="sp-cover" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="catGlow" cx="50%" cy="40%" r="55%">
                <stop offset="0%" stop-color="#f2e6d4" stop-opacity="0.55"/>
                <stop offset="60%" stop-color="#8eb4c8" stop-opacity="0.12"/>
                <stop offset="100%" stop-color="#8eb4c8" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="catFur" x1="0.3" y1="0" x2="0.8" y2="1">
                <stop offset="0%" stop-color="#f7efe4"/>
                <stop offset="55%" stop-color="#e8d5b5"/>
                <stop offset="100%" stop-color="#c9b08a"/>
              </linearGradient>
              <linearGradient id="catShade" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#d4bf9a"/>
                <stop offset="100%" stop-color="#a89070"/>
              </linearGradient>
            </defs>

            <circle cx="120" cy="110" r="78" fill="url(#catGlow)"/>

            <!-- soft floor oval -->
            <ellipse cx="120" cy="188" rx="62" ry="12" fill="#8eb4c8" opacity="0.18"/>

            <!-- cute sitting cat -->
            <g transform="translate(120 128)">
              <!-- tail -->
              <path d="M42 28 C68 18 74 -8 52 -22" fill="none" stroke="#e8d5b5" stroke-width="10" stroke-linecap="round"/>
              <path d="M42 28 C68 18 74 -8 52 -22" fill="none" stroke="#c9b08a" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

              <!-- body -->
              <ellipse cx="0" cy="34" rx="38" ry="32" fill="url(#catFur)"/>
              <ellipse cx="8" cy="40" rx="22" ry="18" fill="url(#catShade)" opacity="0.35"/>

              <!-- front paws -->
              <ellipse cx="-14" cy="58" rx="11" ry="7" fill="#f2e6d4"/>
              <ellipse cx="14" cy="58" rx="11" ry="7" fill="#f2e6d4"/>

              <!-- head -->
              <circle cx="0" cy="-8" r="28" fill="url(#catFur)"/>

              <!-- ears -->
              <path d="M-24 -22 L-34 -48 L-8 -30 Z" fill="#e8d5b5"/>
              <path d="M-24 -24 L-30 -42 L-12 -30 Z" fill="#f7c9c4" opacity="0.85"/>
              <path d="M24 -22 L34 -48 L8 -30 Z" fill="#e8d5b5"/>
              <path d="M24 -24 L30 -42 L12 -30 Z" fill="#f7c9c4" opacity="0.85"/>

              <!-- cheeks -->
              <circle cx="-16" cy="-2" r="7" fill="#f7c9c4" opacity="0.45"/>
              <circle cx="16" cy="-2" r="7" fill="#f7c9c4" opacity="0.45"/>

              <!-- eyes (happy closed) -->
              <path d="M-14 -8 Q-9 -13 -4 -8" fill="none" stroke="#3a2e24" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M4 -8 Q9 -13 14 -8" fill="none" stroke="#3a2e24" stroke-width="2.2" stroke-linecap="round"/>

              <!-- nose + smile -->
              <ellipse cx="0" cy="2" rx="3.2" ry="2.4" fill="#d9898a"/>
              <path d="M0 4 Q-5 10 -10 7" fill="none" stroke="#3a2e24" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M0 4 Q5 10 10 7" fill="none" stroke="#3a2e24" stroke-width="1.5" stroke-linecap="round"/>

              <!-- whiskers -->
              <g stroke="#3a2e24" stroke-opacity="0.35" stroke-width="1" stroke-linecap="round">
                <line x1="-8" y1="4" x2="-34" y2="0"/>
                <line x1="-8" y1="7" x2="-34" y2="8"/>
                <line x1="8" y1="4" x2="34" y2="0"/>
                <line x1="8" y1="7" x2="34" y2="8"/>
              </g>

              <!-- tiny heart float -->
              <g transform="translate(36 -36) scale(0.45)" fill="#f2e6d4" opacity="0.9">
                <path d="M0 8 C-8 -2 -16 -2 -16 4 C-16 10 -4 16 0 20 C4 16 16 10 16 4 C16 -2 8 -2 0 8 Z"/>
              </g>
            </g>
          </svg>